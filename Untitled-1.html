<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f3ed">
  <meta name="description" content="Calculadoras y agenda en un solo lugar.">
  <title>Mis herramientas</title>
  
  <link rel="stylesheet" href="style.css">
</head>
<body>
  
  <main>
        <section class="dashboard" id="tools">
          <header class="intro">
            <p>Elige una opcion</p>
          </header>
          <section class="tool-switcher" aria-label="Herramientas">
            <input class="tool-radio" type="radio" name="tool" id="tool-age" checked>
            <input class="tool-radio" type="radio" name="tool" id="tool-temperature">
            <input class="tool-radio" type="radio" name="tool" id="tool-agenda">
            <nav class="tool-nav" aria-label="Seleccionar herramienta">
              <label for="tool-age">Edad</label>
              <label for="tool-temperature">Temperatura</label>
              <label for="tool-agenda">Agenda de tareas</label>
            </nav>
            <div class="tool-stage">
              <section class="tool-panel age-panel" aria-labelledby="age-title">
                <p class="panel-kicker">CALCULADORA</p>
                <h2 id="age-title">Calculadora de edad</h2>
                <p>Consulta tu edad </p>
                <form id="age-form">
                  <label class="field">Fecha de nacimiento<input id="birth-date" type="date" required></label>
                  <button type="submit">Calcular edad</button>
                </form>
                <div class="result-row"><span>Tu edad</span><output id="age-result" aria-live="polite">—</output></div>
              </section>
              <section class="tool-panel temperature-panel" aria-labelledby="temperature-title">
                <p class="panel-kicker">CALCULADORA</p>
                <h2 id="temperature-title">Calculadora de temperatura</h2>
                <p>Prepara una conversión entre escalas.</p>
                <form id="temperature-form">
                  <label class="field temperature-field">Temperatura<input id="temperature-value" type="number" step="any" required></label>
                  <label class="field">De
                    <select id="temperature-from">
                      <option value="celsius">Celsius (°C)</option>
                      <option value="fahrenheit">Fahrenheit (°F)</option>
                      <option value="kelvin">Kelvin (K)</option>
                    </select>
                  </label>
                  <label class="field">A
                    <select id="temperature-to">
                      <option value="fahrenheit">Fahrenheit (°F)</option>
                      <option value="celsius">Celsius (°C)</option>
                      <option value="kelvin">Kelvin (K)</option>
                    </select>
                  </label>
                  <button type="submit">Convertir</button>
                </form>
                <div class="result-row"><span>Resultado</span><output id="temperature-result" aria-live="polite">—</output></div>
              </section>
              <section class="tool-panel agenda-panel" aria-labelledby="agenda-title">
                <p class="panel-kicker">PLANIFICACIÓN</p>
                <h2 id="agenda-title">Agenda de tareas</h2>
                <p>Marca las tareas que ya terminaste.</p>
                <form id="task-form">
                  <label class="field">Nueva tarea<input id="task-name" type="text" maxlength="100" required></label>
                  <label class="field">Hora (opcional)<input id="task-time" type="time"></label>
                  <button type="submit">Agregar tarea</button>
                </form>
                <ul class="task-list" id="task-list" aria-live="polite"></ul>
              </section>
            </div>
          </section>
        </section>
  </main>
  <script src="script.js" defer></script>
</body>
</html>
